name: QA & Security Check

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/ml_pipeline.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "tests/**"
      - "app.py"
      - "requirements.txt"
      - ".github/workflows/ml_pipeline.yml"

permissions:
  contents: read

jobs:
  qa_qc:
    name: Bandit + Pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit

      - name: Security Scan (Bandit)
        run: |
          bandit -r src/ app.py --severity-level medium

      - name: Run Tests (Pytest)
        run: |
          pytest tests/ -v
        env:
          PYTHONPATH: .
