name: MLOps Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  qa_qc_and_train:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install bandit
        
    - name: Security Scan (QA/QC)
      run: |
        bandit -r src/
        
    - name: Run Tests (QA/QC)
      run: |
        pytest tests/
      env:
        PYTHONPATH: .
        
    - name: Train Models (MLOps)
      run: |
        python -m src.train
      env:
        PYTHONPATH: .
